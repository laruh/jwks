[package]
name = "jwks"
version = "0.5.1"
edition = "2021"
authors = ["Hung-Han Chen <chenhungh@gmail.com>"]
description = "A library for retrieving and parsing JSON Web Key Sets (JWKS)"
license = "MIT"
license-file = "LICENSE"
repository = "https://github.com/chenhunghan/jwks"
readme = "README.md"
keywords = ["jwt", "jsonwebtoken", "jwks"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22.1"
jsonwebtoken = "10.2.0"
reqwest = { version = "0.13.1", features = ["json", "rustls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2"

[features]
aws_lc_rs = [ "jsonwebtoken/aws_lc_rs" ]
rust_crypto = [ "jsonwebtoken/rust_crypto" ]

[dev-dependencies]
httpmock = "0.8"
serde_json = "1"
rsa = "0.9"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros"] }
